<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TV</title>
<link rel="stylesheet" href="/static/common.css">
<style>html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#overlay{position:fixed;left:0;right:0;bottom:0;padding:20px;color:#fff}</style>
</head>
<body>
<div id="player"></div>
<div id="overlay">PUB Jukebox TV</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
async function vote(id){await fetch('/api/queue/'+id+'/vote',{method:'POST'})}
async function load(){let a=await (await fetch('/api/queue')).json();if(a[0]&&a[0].video_id){player.loadVideoById(a[0].video_id)}}
let player, current=null;
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{width:'100%',height:'100%',videoId:''})}
setInterval(load,1500);load();
</script>
</body>
</html>
