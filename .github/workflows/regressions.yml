name: Jukebox regressions
on:
  pull_request:
  push:
    branches: [main, fix/autodj-party-regressions]
permissions:
  contents: read
concurrency:
  group: jukebox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tests/sql/package-lock.json
            tests/browser/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: JavaScript playback and UI regressions
        run: for test in tests/test_*.mjs; do node "$test" || exit 1; done
      - run: npm ci --prefix tests/sql
      - run: npm test --prefix tests/sql
      - run: npm ci --prefix tests/browser
      - run: node tests/browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm test --prefix tests/browser
