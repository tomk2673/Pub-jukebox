<!doctype html><html><head><meta charset="utf-8"><style>html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#overlay{position:fixed;left:0;right:0;bottom:0;padding:20px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:white;font:28px Arial;z-index:9}</style></head><body><div id="player"></div><div id="overlay">PUB JUKEBOX</div><script src="https://www.youtube.com/iframe_api"></script><script>let player,current=null;function onYouTubeIframeAPIReady(){player=new YT.Player('player',{width:'100%',height:'100%',playerVars:{autoplay:1,controls:1,rel:0},events:{onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)advance()}}})}async function advance(){await fetch('/api/next',{method:'POST',headers:{'x-admin-pin':'2673'}});sync()}async function sync(){let q=await (await fetch('/api/queue')).json();let s=q.find(x=>x.status==='playing');if(!s){let n=q.find(x=>x.status==='queued');if(n){await fetch('/api/queue/'+n.id+'/play',{method:'POST',headers:{'x-admin-pin':'2673'}});return sync()}return}overlay.textContent='▶ '+s.title+'  •  👍 '+s.votes;if(player&&s.video_id!==current){current=s.video_id;player.loadVideoById(s.video_id)}}setInterval(sync,1500);</script></body></html>
