<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/common.css"><title>Fronta</title></head><body><div class="wrap"><h1>Co hraje dál?</h1><p>Z telefonu můžeš hlasovat. Novou skladbu přidej na jukeboxu.</p><div id="queue"></div></div><script>async function vote(id){await fetch('/api/queue/'+id+'/vote',{method:'POST',headers:{'content-type':'application/json'},body:'{"delta":1}'});load()}async function load(){let a=await (await fetch('/api/queue')).json();queue.innerHTML=a.map(s=>`<div class="card row"><div><b>${s.title}</b><div class="small">${s.status==='playing'?'PRÁVĚ HRAJE':'čeká'}</div></div>${s.status==='queued'?`<button onclick="vote(${s.id})">👍 ${s.votes}</button>`:'<span class="badge">▶</span>'}</div>`).join('')}setInterval(load,1500);load();</script></body></html>
